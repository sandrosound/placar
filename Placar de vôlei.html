<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Placar de vôlei</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@500;600&display=swap">
<style>
:root{
  --bg:#e8edf4;--panel:#ffffff;--ink:#101826;--mute:#5b6779;--line:#c9d2de;
  --a:#d98e00;--b:#0a7fc2;--on:#ffffff;--warn:#c43d2f;
  --num:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --txt:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d131c;--panel:#161f2c;--ink:#f1f4f8;--mute:#8d9bb0;--line:#2a3648;--a:#ffc83d;--b:#47bdff;--on:#0d131c;--warn:#ff7a6b}
}
:root[data-theme="dark"]{--bg:#0d131c;--panel:#161f2c;--ink:#f1f4f8;--mute:#8d9bb0;--line:#2a3648;--a:#ffc83d;--b:#47bdff;--on:#0d131c;--warn:#ff7a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--txt);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.setinfo{font-family:var(--num);font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.setinfo small{font-family:var(--txt);font-weight:500;font-size:.85rem;color:var(--mute);margin-left:8px}
.hist{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-family:var(--num);font-weight:700;font-size:1.05rem;color:var(--mute)}
.hist span{padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.board{flex:1;display:flex;min-height:0}
.team{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;column-gap:14px;align-items:center;padding:10px 12px 12px;min-width:0;min-height:0;container-type:size;border-bottom:1px solid var(--line);--c:var(--a)}
.team[data-i="1"]{--c:var(--b);border-bottom:0}
.name{width:100%;max-width:min(22rem,calc(100% - 170px));background:transparent;border:0;border-bottom:2px solid var(--c);color:var(--ink);font-family:var(--num);font-weight:800;font-size:1.9rem;text-align:center;padding:2px 4px;border-radius:0;outline-offset:3px}
.meta{display:flex;align-items:center;gap:16px;min-height:44px}
.ball{background:none;border:2px solid transparent;border-radius:50%;width:44px;height:44px;font-size:1.5rem;line-height:1;opacity:.25;filter:grayscale(1);transition:opacity .15s,filter .15s}
.ball.on{opacity:1;filter:none;border-color:var(--c)}
.sets{font-family:var(--num);font-weight:800;font-size:1.15rem;color:var(--mute)}
.sets b{font-size:2rem;color:var(--c);margin-left:6px}
.score{flex:1;width:100%;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--c);font-family:var(--num);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;font-size:min(24vw,46vh)}
.score:active{transform:scale(.97)}
:root{--bg:#070b11;--panel:#141c28;--ink:#f1f4f8;--mute:#8d9bb0;--line:#263245;--on:#070b11}
.score{text-shadow:0 2px 14px rgba(0,0,0,.45)}
.team{position:relative}
.clr{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:2px solid var(--c);border-radius:50%;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.clr::-webkit-color-swatch-wrapper{padding:0}.clr::-webkit-color-swatch{border:0;border-radius:50%}
.rotb{position:absolute;top:10px;left:10px;min-height:34px;padding:4px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--c);font-family:var(--num);font-weight:700;font-size:1.1rem}
.card{max-height:100%;overflow:auto}
.court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.8rem}
.cell input,#sin{width:100%;min-height:44px;text-align:center;font:700 1.4rem var(--num);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
#sin{width:5rem;font-size:1.1rem}
#sinn{min-height:44px;flex:1 1 9rem;padding:0 10px;font:600 1rem var(--txt);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.cell input.pn{font:600 .85rem var(--txt);min-height:34px;margin-top:4px}
.card .row{margin-bottom:12px}
.top{flex-wrap:wrap}
.trow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tc{width:40px;height:40px;padding:0;border:2px solid var(--line);border-radius:50%;background:none;-webkit-appearance:none;appearance:none;flex:none}
.tc::-webkit-color-swatch-wrapper{padding:0}.tc::-webkit-color-swatch{border:0;border-radius:50%}
.tn{flex:1;min-width:0;min-height:44px;padding:0 10px;font:700 1.1rem var(--num);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.tx{padding:4px 12px;flex:none}
#ma,#mb{flex:1;min-width:0}
.hl{text-align:left;font-size:.95rem;margin-bottom:12px}
.hl div{padding:6px 0;border-bottom:1px solid var(--line)}
.hl small{display:block;color:var(--mute)}
#cpt,#cptd,#mn{width:6rem;min-height:44px;text-align:center;font:700 1.4rem var(--num);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 16px;color:var(--ink)}
.chk input{width:22px;height:22px}
.go{position:fixed;inset:0;margin:auto;width:max-content;height:max-content;z-index:8;font:800 clamp(1.8rem,9vw,3rem) var(--num);letter-spacing:.04em;line-height:1.1;white-space:nowrap;padding:.5em .8em;border-radius:20px;background:#22c55e;color:#000;border:5px solid #ffd400;box-shadow:0 0 0 100vmax rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.5)}
#go.go{font:800 clamp(1.2rem,5vw,2rem) var(--num);line-height:1.1;min-height:0;padding:.45em .75em;background:#22c55e;color:#000;border:3px solid #d9b94a;border-radius:16px}
#mgo{background:#22c55e;color:#000;border:3px solid #d9b94a;font-size:1rem;min-height:44px;padding:6px 18px}
.go:not(.nudge){animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.nudge{animation:nudge .45s}
@keyframes nudge{30%{transform:scale(1.14)}60%{transform:scale(.96)}}
.clk{font-family:var(--num);font-weight:700;font-size:1.1rem;color:var(--mute);font-variant-numeric:tabular-nums}
#bestof{display:none}
#cnb{min-width:12rem}
.wm{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font:600 .7rem var(--txt);letter-spacing:.06em;color:var(--ink);opacity:.45;pointer-events:none;z-index:5}
.card p#rsubs{margin:0 0 14px;font-size:.9rem}
.score:focus-visible,.btn:focus-visible,.ball:focus-visible,.name:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.to{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:1rem}
.to i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.to i.used{background:transparent;border:2px solid var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.btn,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:1rem;min-height:44px}
.btn:disabled{opacity:.4;cursor:default}
select{color:var(--ink);font-family:inherit}
.btn.danger{color:var(--warn)}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.82);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.ov.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 24px;max-width:24rem;width:100%;text-align:center}
.card h2{margin:0 0 6px;font-family:var(--num);font-weight:800;font-size:2.4rem;line-height:1}
.card p{margin:0 0 20px;color:var(--mute);font-size:1.05rem}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.card .btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.board{flex-direction:column}
.name{grid-column:1/-1;justify-self:center;font-size:1.5rem}
.score{grid-column:1/-1;grid-row:2;font-size:min(90vw,34vh);line-height:.75;min-height:0}
.score{font-size:min(90cqw,calc((100cqh - 104px)*1.3))}
.bar{gap:6px;padding:8px 10px 14px}
.btn,select{min-height:40px;padding:6px 12px;font-size:.95rem}
.meta{grid-column:1;grid-row:3;justify-self:end}
.to{grid-column:2;grid-row:3;justify-self:start}
body.hb .bar{display:none}
@media (orientation:landscape){
  .board{flex-direction:row}
  .team{border-bottom:0;border-right:1px solid var(--line);padding:4px 8px 4px}
  .team[data-i="1"]{border-right:0}
  .name{font-size:1.1rem;padding:0 4px}
  .rotb{top:4px;left:8px;min-height:28px;padding:2px 10px;font-size:1rem}
  .clr{top:4px;right:8px;width:28px;height:28px}
  .sets b{font-size:1.4rem}
  .score{font-size:min(30vw,38vh)}
  .score{font-size:min(90cqw,calc((100cqh - 70px)*1.35));line-height:.74}
  .top{padding:2px 14px}
  .setinfo small{display:none}
  .bar{padding:6px 14px 14px;gap:6px}
  .btn,select{min-height:38px;padding:6px 12px;font-size:.95rem}
  .ball{width:28px;height:28px;font-size:1.1rem}
  .meta{min-height:28px;gap:10px}
  .to{padding:2px 12px;min-height:30px;font-size:.9rem}
}
@media (prefers-reduced-motion:reduce){.score:active{transform:none}.ball{transition:none}}

<body>
<header class="top">
  <div class="setinfo" id="setinfo"></div>
  <div class="clk" id="clk" aria-label="Tempo de partida"></div>
  <div class="hist" id="hist" aria-label="Placares dos sets anteriores"></div>
  <button class="btn" id="mat" style="min-height:32px;padding:2px 10px;font-size:.85rem">Partidas</button>
  <button class="btn" id="tgl" style="min-height:32px;padding:2px 10px;font-size:.85rem">Ocultar controles</button>
</header>

<main class="board">
  <section class="team" data-i="0">
    <input class="name" aria-label="Nome do time 1" maxlength="16" value="Time A">
    <button class="rotb" aria-label="Rodízio e substituições do time 1">↻</button><input type="color" class="clr" aria-label="Cor do time 1" value="#ffc83d">
    <div class="meta">
      <button class="ball" aria-label="Saque do time 1">🏐</button>
      <div class="sets">Sets<b>0</b></div>
    </div>
    <button class="score" aria-label="Marcar ponto para o time 1">0</button>
    <button class="to"></button>
  </section>
  <section class="team" data-i="1">
    <input class="name" aria-label="Nome do time 2" maxlength="16" value="Time B">
    <button class="rotb" aria-label="Rodízio e substituições do time 2">↻</button><input type="color" class="clr" aria-label="Cor do time 2" value="#47bdff">
    <div class="meta">
      <button class="ball" aria-label="Saque do time 2">🏐</button>
      <div class="sets">Sets<b>0</b></div>
    </div>
    <button class="score" aria-label="Marcar ponto para o time 2">0</button>
    <button class="to"></button>
  </section>
</main>

<footer class="bar">
  <button class="btn" id="undo">Desfazer</button>
  <button class="btn" id="swap">Trocar lados</button>
  <button class="btn" id="mute" aria-pressed="false">Som: ligado</button>
  <button class="btn" id="whistle">Apito</button>
  <button class="btn" id="cfg">Configurar set</button>
  <select id="bestof" aria-label="Formato da partida">
    <option value="1">1 set</option>
    <option value="3">Melhor de 3</option>
    <option value="5" selected>Melhor de 5</option>
  </select>
  <button class="btn danger" id="reset">Nova partida</button>
</footer>

<div class="ov" id="mov" role="dialog" aria-modal="true">
  <div class="card">
    <h2>Partidas</h2>
    <p style="margin-bottom:8px">Times (2 a 6)</p>
    <div id="tlist"></div>
    <div class="row"><button class="btn" id="tadd">+ Adicionar time</button></div>
    <p style="margin-bottom:8px">Nova partida</p>
    <div class="row"><select id="ma" aria-label="Time 1"></select><span>×</span><select id="mb" aria-label="Time 2"></select></div>
    <p style="margin-bottom:8px">Número de partidas</p>
    <div class="row"><input id="mn" type="number" inputmode="numeric" min="1" max="99" aria-label="Número de partidas"></div>
    <div class="row"><button class="btn main" id="mgo">Iniciar partida</button></div>
    <p style="margin-bottom:8px">Resultados</p>
    <div class="hl" id="hlist"></div>
    <div class="row"><button class="btn danger" id="hclr">Limpar resultados</button></div>
    <div class="row"><button class="btn" id="mclose">Fechar</button></div>
  </div>
</div>

<button class="btn go" id="go">▶ INICIAR PARTIDA</button>

<div class="wm">Sandro dev</div>

<div class="ov" id="cov" role="dialog" aria-modal="true">
  <div class="card">
    <h2>Configurar set</h2>
    <p style="margin-bottom:8px">Pontos para ganhar cada set</p>
    <div class="row"><input id="cpt" type="number" inputmode="numeric" min="5" max="99" aria-label="Pontos do set"></div>
    <div class="row"><button class="btn pre" data-f="cpt" data-v="15">15</button><button class="btn pre" data-f="cpt" data-v="21">21</button><button class="btn pre" data-f="cpt" data-v="25">25</button></div>
    <p style="margin-bottom:8px">Pontos do set decisivo</p>
    <div class="row"><input id="cptd" type="number" inputmode="numeric" min="5" max="99" aria-label="Pontos do set decisivo"></div>
    <div class="row"><button class="btn pre" data-f="cptd" data-v="11">11</button><button class="btn pre" data-f="cptd" data-v="15">15</button><button class="btn pre" data-f="cptd" data-v="21">21</button></div>
    <p style="margin-bottom:8px">Número de sets da partida</p>
    <div class="row"><select id="cnb" aria-label="Número de sets"><option value="1">1 set</option><option value="2">2 sets (melhor de 3)</option><option value="3">3 sets (melhor de 5)</option></select></div>
    <label class="chk"><input type="checkbox" id="cadv"> Vantagem de 2 pontos</label>
    <div class="row"><button class="btn main" id="cok">Salvar</button></div>
    <div class="row"><button class="btn danger" id="creset">Limpar cache e restaurar</button></div>
  </div>
</div>

<div class="ov" id="rov" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="rtitle"></h2>
    <p style="margin-bottom:10px">Rede</p>
    <div class="court" id="court"></div>
    <div class="row"><button class="btn" id="rrot">Girar rodízio</button></div>
    <div class="row"><select id="sout" aria-label="Jogador que sai"></select><input id="sin" inputmode="numeric" maxlength="2" placeholder="Entra" aria-label="Jogador que entra"><input id="sinn" maxlength="16" placeholder="Nome (opcional)" aria-label="Nome do jogador que entra"><button class="btn" id="rsub">Substituir</button></div>
    <p id="rsubs"></p>
    <div class="row"><button class="btn main" id="rclose">Fechar</button></div>
  </div>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="ovt"></h2>
    <p id="ovp"></p>
    <div class="row">
      <button class="btn" id="ovundo">Corrigir ponto</button>
      <button class="btn main" id="ovok"></button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY="placar-volei-v1";
  var fresh=function(best){return{names:["Time A","Time B"],colors:(S&&S.colors)||["#ffc83d","#47bdff"],court:[["1","2","3","4","5","6"],["1","2","3","4","5","6"]],subs:[0,0],pt:(S&&S.pt)||25,ptd:(S&&S.ptd)||15,adv:(S&&S.adv===false)?false:true,tm:(S&&S.tm)||[0,1],pts:[0,0],sets:[0,0],hist:[],serve:null,to:[0,0],best:best||5,flip:false,pending:null,over:null}};
  var S=fresh(5), stack=[], P=[{},{}];
  try{var rp=JSON.parse(localStorage.getItem("placar-volei-v1-players"));if(rp&&rp.length===2)P=rp}catch(e){}
  function saveP(){try{localStorage.setItem("placar-volei-v1-players",JSON.stringify(P))}catch(e){}}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
  var $=function(s,r){return (r||document).querySelector(s)};
  var teams=[].slice.call(document.querySelectorAll(".team"));

  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&d.S){S=d.S;stack=d.stack||[]}}}catch(e){}

  var T=null,H=[],G={n:1,i:1,h0:0};
  try{var rg=JSON.parse(localStorage.getItem(KEY+"-teams"));if(rg&&rg.T&&rg.T.length>=2){T=rg.T;H=rg.H||[];if(rg.G)G=rg.G}}catch(e){}
  function dc(){return["1","2","3","4","5","6"]}
  if(!T){T=[0,1].map(function(k){return{n:S.names?S.names[k]:"Time "+"AB".charAt(k),c:(S.colors&&S.colors[k])||["#ffc83d","#47bdff"][k],court:(S.court&&S.court[k])||dc(),pl:P[k]||{}}})}
  S.tm=S.tm||[0,1];
  function syncBack(){try{S.tm.forEach(function(k,x){var t=T[k];if(!t)return;t.n=S.names[x];if(S.colors)t.c=S.colors[x];if(S.court)t.court=S.court[x];t.pl=P[x]})}catch(e){}}
  function saveT(){try{localStorage.setItem(KEY+"-teams",JSON.stringify({T:T,H:H,G:G}))}catch(e){}}
  function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=function(n){return n<10?"0"+n:""+n};return h?h+":"+p(m)+":"+p(r):m+":"+p(r)}
  function tick(){var g=$("#go");if(g)g.style.display=(S.t0||S.over!==null)?"none":"";var el=$("#clk");if(!el)return;el.textContent=S.t0?"⏱ "+fmt((S.over!==null&&S.t1?S.t1:Date.now())-S.t0):""}
  setInterval(tick,1000);
  $("#go").addEventListener("click",function(){if(S.t0||S.over!==null)return;snap();S.t0=Date.now();sound("whistle");render()});
  function resetAll(){
    if(!confirm("Limpar os dados salvos e restaurar as configurações originais? Times, jogadores, resultados e o placar atual serão apagados."))return;
    try{[KEY,KEY+"-players",KEY+"-teams",KEY+"-mute"].forEach(function(k){localStorage.removeItem(k)})}catch(e){}
    S=null;S=fresh(5);stack=[];P=[{},{}];H=[];G={n:1,i:1,h0:0};
    T=[0,1].map(function(k){return{n:S.names[k],c:S.colors[k],court:dc(),pl:{}}});
    muted=false;muteUI();
    document.body.classList.remove("hb");$("#tgl").textContent="Ocultar controles";
    $("#cov").classList.remove("show");render();
  }
  $("#creset").addEventListener("click",resetAll);
  function recordMatch(){if(S.over===null)return;H.push({a:S.names[0],b:S.names[1],sa:S.sets[0],sb:S.sets[1],d:S.t0?(S.t1||Date.now())-S.t0:0,s:S.hist.map(function(h){return h[0]+"–"+h[1]}).join(", ")});if(H.length>50)H.shift();saveT()}
  function save(){syncBack();saveT();try{localStorage.setItem(KEY,JSON.stringify({S:S,stack:stack.slice(-60)}))}catch(e){}}
  function snap(){stack.push(JSON.stringify(S));if(stack.length>200)stack.shift()}
  function need(){return Math.ceil(S.best/2)}
  function deciding(){return need()>1&&S.sets[0]===need()-1&&S.sets[1]===need()-1}
  function target(){return deciding()?S.ptd:S.pt}
  function buzz(){try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
  var AC=null,muted=false;
  try{muted=localStorage.getItem(KEY+"-mute")==="1"}catch(e){}
  function beep(f,t,d,type,v){
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,AC.currentTime+t);
    g.gain.exponentialRampToValueAtTime(v||0.25,AC.currentTime+t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+d);
    o.connect(g);g.connect(AC.destination);
    o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d+0.02);
  }
  function whistle(t,d){
    var o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),s=AC.currentTime+t;
    o.type="sine";o.frequency.value=2900;l.frequency.value=30;lg.gain.value=90;
    l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.3,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g);g.connect(AC.destination);
    o.start(s);l.start(s);o.stop(s+d+0.02);l.stop(s+d+0.02);
  }
  function sound(k){
    if(muted)return;
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==="suspended")AC.resume();
      if(k==="pt"){beep(880,0,0.12,"square",0.12)}
      else if(k==="undo"){beep(330,0,0.14,"triangle",0.2)}
      else if(k==="whistle"){whistle(0,0.6)}
      else if(k==="tw"){whistle(0,0.18);whistle(0.26,0.18)}
      else if(k==="set"){whistle(0,0.5);[660,880,1100].forEach(function(f,n){beep(f,0.6+n*0.14,0.22,"triangle",0.28)})}
      else if(k==="win"){[523,659,784,1047,784,1047].forEach(function(f,n){beep(f,n*0.16,0.3,"triangle",0.3)})}
    }catch(e){}
  }
  function muteUI(){var b=document.getElementById("mute");b.textContent="Som: "+(muted?"desligado":"ligado");b.setAttribute("aria-pressed",String(muted))}

  function add(i){
    if(S.pending!==null||S.over!==null)return;
    if(!S.t0){var g=$("#go");g.classList.remove("nudge");void g.offsetWidth;g.classList.add("nudge");return}snap();S.pts[i]++;if(S.serve!==null&&S.serve!==i)rotate(i);S.serve=i;
    var p=S.pts[i],q=S.pts[1-i];
    if(p>=target()&&p-q>=(S.adv===false?1:2))S.pending=i;
    sound(S.pending!==null?"set":"pt");buzz();render();
  }
  function commitSet(){
    var w=S.pending;if(w===null)return;
    snap();
    S.hist.push([S.pts[0],S.pts[1]]);
    S.sets[w]++;S.pts=[0,0];S.to=[0,0];S.subs=[0,0];S.pending=null;S.serve=null;
    if(S.sets[w]>=need()){S.over=w;S.t1=Date.now();sound("win")}
    render();
  }
  function undo(){
    if(!stack.length)return;
    S=JSON.parse(stack.pop());sound("undo");render();
  }
  function rotate(i){var c=S.court[i];S.court[i]=[c[1],c[2],c[3],c[4],c[5],c[0]]}
  var rt=0;
  function buildRot(){
    var c=S.court[rt],h="";
    [3,2,1,4,5,0].forEach(function(p){h+='<label class="cell"><small>P'+(p+1)+'</small><input data-p="'+p+'" inputmode="numeric" maxlength="2" value="'+c[p]+'"><input class="pn" data-n="'+p+'" maxlength="16" placeholder="Nome" value="'+esc(P[rt][c[p]]||"")+'"></label>'});
    $("#court").innerHTML=h;
    $("#rtitle").textContent=S.names[rt];
    $("#sout").innerHTML='<option value="">Sai</option>'+c.map(function(n){return'<option value="'+n+'">'+n+(P[rt][n]?' · '+esc(P[rt][n]):'')+'</option>'}).join("");
    $("#rsubs").textContent="Substituições: "+S.subs[rt]+" de 6 neste set";
  }
  function openRot(i){rt=i;buildRot();$("#rov").classList.add("show")}
  $("#court").addEventListener("input",function(e){var t=e.target,p=t.dataset.p,q=t.dataset.n;if(q!==undefined){var nn=S.court[rt][+q];if(nn)P[rt][nn]=t.value;saveP();return}if(p===undefined)return;S.court[rt][+p]=t.value.replace(/\D/g,"").slice(0,2);save()});
  $("#court").addEventListener("change",function(e){if(e.target.dataset.p!==undefined){buildRot();render()}});
  $("#rrot").addEventListener("click",function(){snap();rotate(rt);sound("tw");buildRot();render()});
  $("#rsub").addEventListener("click",function(){
    var o=$("#sout").value,n=$("#sin").value.trim(),c=S.court[rt];
    if(!o||!n||c.indexOf(n)>-1)return;
    if(S.subs[rt]>=6){alert("Limite de 6 substituições por set.");return}
    snap();c[c.indexOf(o)]=n;S.subs[rt]++;var nm2=$("#sinn").value.trim();if(nm2){P[rt][n]=nm2;saveP()}$("#sin").value="";$("#sinn").value="";sound("tw");buildRot();render();
  });
  $("#rclose").addEventListener("click",function(){$("#rov").classList.remove("show");render()});
  $("#cfg").addEventListener("click",function(){$("#cpt").value=S.pt;$("#cptd").value=S.ptd;$("#cadv").checked=S.adv!==false;$("#cnb").value=String(Math.ceil(S.best/2));$("#cov").classList.add("show")});
  $("#cov").addEventListener("click",function(e){var b=e.target.closest(".pre");if(b)$("#"+b.dataset.f).value=b.dataset.v});
  var PAL=["#ffc83d","#47bdff","#ff6b6b","#5ee08a","#c08bff","#ff9f45"];
  function buildSel(){
    var o=T.map(function(t,k){return'<option value="'+k+'">'+esc(t.n)+'</option>'}).join(""),a=$("#ma"),b=$("#mb"),va=a.value||S.tm[0],vb=b.value||S.tm[1];
    a.innerHTML=o;b.innerHTML=o;a.value=va;b.value=vb;
  }
  function buildM(){
    var h="";
    T.forEach(function(t,k){h+='<div class="trow"><input type="color" class="tc" data-k="'+k+'" value="'+t.c+'" aria-label="Cor do time"><input class="tn" data-k="'+k+'" maxlength="16" value="'+esc(t.n)+'" aria-label="Nome do time"><button class="btn tx" data-k="'+k+'" aria-label="Remover time"'+(T.length<=2||S.tm.indexOf(k)>-1?' disabled':'')+'>✕</button></div>'});
    $("#tlist").innerHTML=h;
    $("#tadd").disabled=T.length>=6;
    $("#mn").value=G.n;
    $("#ma").innerHTML="";$("#mb").innerHTML="";buildSel();
    var rk="";if(G.n>1){var w={};H.slice(G.h0).forEach(function(m){var k=m.sa>m.sb?m.a:m.b;w[k]=(w[k]||0)+1});rk=Object.keys(w).length?'<div><b>Vitórias:</b> '+Object.keys(w).map(function(k){return esc(k)+' '+w[k]}).join(' · ')+'</div>':''}
    $("#hlist").innerHTML=rk+(H.length?H.slice().reverse().slice(0,10).map(function(m){return'<div>'+esc(m.a)+' <b>'+m.sa+' × '+m.sb+'</b> '+esc(m.b)+'<small>'+esc(m.s)+(m.d?' · ⏱ '+fmt(m.d):'')+'</small></div>'}).join(""):'<div>Nenhuma partida concluída ainda</div>');
  }
  function startMatch(a,b){var f=S.flip;S=fresh(S.best);S.flip=f;S.tm=[a,b];S.names=[T[a].n,T[b].n];S.colors=[T[a].c,T[b].c];S.court=[T[a].court.slice(),T[b].court.slice()];P=[T[a].pl,T[b].pl];saveP();stack=[];render()}
  function nextMatch(){
    var w=S.tm[S.over],l=S.tm[1-S.over],nT=T.length,c=l;
    syncBack();recordMatch();
    for(var s=1;s<=nT;s++){c=(l+s)%nT;if(c!==w)break}
    G.i++;saveT();startMatch(w,c);
  }
  $("#mn").addEventListener("change",function(){G.n=Math.min(99,Math.max(parseInt(this.value,10)||1,G.i));this.value=G.n;saveT();render()});
  $("#mat").addEventListener("click",function(){buildM();$("#mov").classList.add("show")});
  $("#mclose").addEventListener("click",function(){$("#mov").classList.remove("show");render()});
  $("#hclr").addEventListener("click",function(){if(!H.length&&G.i===1)return;if(!confirm("Apagar todos os resultados e o andamento das partidas? O placar atual não será alterado."))return;H=[];G={n:G.n,i:1,h0:0};saveT();buildM();render()});
  $("#tlist").addEventListener("input",function(e){
    var t=e.target,k=+t.dataset.k;if(!T[k])return;
    if(t.classList.contains("tc"))T[k].c=t.value;else if(t.classList.contains("tn"))T[k].n=t.value;else return;
    var x=S.tm.indexOf(k);if(x>-1){S.names[x]=T[k].n;S.colors[x]=T[k].c;render()}else saveT();
  });
  $("#tlist").addEventListener("change",buildSel);
  $("#tlist").addEventListener("click",function(e){
    var b=e.target.closest(".tx");if(!b||b.disabled)return;
    var k=+b.dataset.k;T.splice(k,1);S.tm=S.tm.map(function(x){return x>k?x-1:x});stack=[];saveT();buildM();render();
  });
  $("#tadd").addEventListener("click",function(){if(T.length>=6)return;T.push({n:"Time "+String.fromCharCode(65+T.length),c:PAL[T.length%6],court:dc(),pl:{}});saveT();buildM()});
  $("#mgo").addEventListener("click",function(){
    var a=+$("#ma").value,b=+$("#mb").value;
    if(a===b){alert("Escolha dois times diferentes.");return}
    if(S.over===null&&S.pts[0]+S.pts[1]+S.sets[0]+S.sets[1]>0&&!confirm("Iniciar uma nova partida? O placar atual será apagado."))return;
    syncBack();recordMatch();G={n:Math.min(99,Math.max(1,parseInt($("#mn").value,10)||1)),i:1,h0:H.length};saveT();
    var f=S.flip;S=fresh(S.best);S.flip=f;S.tm=[a,b];S.names=[T[a].n,T[b].n];S.colors=[T[a].c,T[b].c];S.court=[T[a].court.slice(),T[b].court.slice()];
    P=[T[a].pl,T[b].pl];saveP();stack=[];
    $("#mov").classList.remove("show");render();
  });
  $("#cok").addEventListener("click",function(){
    var a=Math.min(99,Math.max(5,parseInt($("#cpt").value,10)||25)),d=Math.min(99,Math.max(5,parseInt($("#cptd").value,10)||15));
    snap();S.pt=a;S.ptd=d;S.adv=$("#cadv").checked;
    if(S.over===null){S.pending=null;[0,1].forEach(function(i){if(S.pts[i]>=target()&&S.pts[i]-S.pts[1-i]>=(S.adv?2:1))S.pending=i})}
    $("#cov").classList.remove("show");render();
    var nb=2*(+$("#cnb").value||2)-1;if(nb!==S.best){var sel=$("#bestof");sel.value=String(nb);sel.dispatchEvent(new Event("change"))}
  });
  function timeout(i){
    if(S.pending!==null||S.over!==null||S.to[i]>=2)return;
    snap();S.to[i]++;sound("tw");render();
  }
  function newMatch(){recordMatch();
    if(S.pts[0]+S.pts[1]+S.sets[0]+S.sets[1]>0&&S.over===null&&!confirm("Começar uma nova partida? O placar atual será apagado."))return;
    var n=S.names,b=S.best,f=S.flip;S=fresh(b);S.names=n;S.flip=f;stack=[];render();
  }

  function render(){
    S.colors=S.colors||["#ffc83d","#47bdff"];S.court=S.court||[["1","2","3","4","5","6"],["1","2","3","4","5","6"]];S.subs=S.subs||[0,0];S.pt=S.pt||25;S.ptd=S.ptd||15;if(S.adv===undefined)S.adv=true;S.tm=S.tm||[0,1];
    teams.forEach(function(t,k){
      var i=+t.dataset.i;
      t.style.order=(S.flip?1-i:i);
      var nm=$(".name",t);if(document.activeElement!==nm)nm.value=S.names[i];t.style.setProperty("--c",S.colors[i]);var cl=$(".clr",t);if(cl&&cl.value!==S.colors[i])cl.value=S.colors[i];$(".rotb",t).textContent="↻ "+S.court[i][0]+(P[i][S.court[i][0]]?" "+P[i][S.court[i][0]].slice(0,7):"");
      $(".score",t).textContent=S.pts[i];
      $(".sets b",t).textContent=S.sets[i];
      $(".ball",t).classList.toggle("on",S.serve===i);
      var left=2-S.to[i];
      $(".to",t).innerHTML="Tempo "+'<i></i><i class="'+(S.to[i]>=1?"used":"")+'"></i>'.replace('<i></i>','')+"";
      $(".to",t).innerHTML="Tempo <i class='"+(S.to[i]>=1?"used":"")+"'></i><i class='"+(S.to[i]>=2?"used":"")+"'></i>";
      $(".to",t).disabled=left<=0||S.pending!==null||S.over!==null;
      $(".to",t).setAttribute("aria-label","Pedir tempo, restam "+left);
    });
    var n=S.hist.length+1;
    $("#setinfo").innerHTML=(G.n>1?"Partida "+G.i+"/"+G.n+" · ":"")+(S.over!==null?"Fim de jogo":"Set "+n+(deciding()?" · decisivo":""))+"<small>até "+target()+(S.adv===false?"":", diferença de 2")+"</small>";
    $("#hist").innerHTML=S.hist.map(function(h){return"<span>"+h[0]+"–"+h[1]+"</span>"}).join("");
    $("#undo").disabled=!stack.length;
    $("#bestof").value=String(S.best);
    var ov=$("#ov");
    if(S.over!==null){
      ov.classList.add("show");
      $("#ovt").textContent=S.names[S.over]+" venceu!";
      $("#ovp").textContent="Sets "+S.sets[S.over]+" a "+S.sets[1-S.over]+" — "+S.hist.map(function(h){return h[0]+"–"+h[1]}).join(", ")+(S.t0&&S.t1?" · ⏱ "+fmt(S.t1-S.t0):"");
      $("#ovok").textContent=G.i<G.n?"Próxima partida":"Nova partida";$("#ovok").dataset.m=G.i<G.n?"next":"new";
      $("#ovundo").style.display="";
    }else if(S.pending!==null){
      ov.classList.add("show");
      $("#ovt").textContent="Set para "+S.names[S.pending];
      $("#ovp").textContent=S.pts[0]+" a "+S.pts[1];
      $("#ovok").textContent="Confirmar set";$("#ovok").dataset.m="set";
      $("#ovundo").style.display="";
    }else ov.classList.remove("show");tick();
    save();
  }

  teams.forEach(function(t){
    var i=+t.dataset.i;
    $(".score",t).addEventListener("click",function(){add(i)});
    $(".to",t).addEventListener("click",function(){timeout(i)});
    $(".ball",t).addEventListener("click",function(){if(S.pending!==null||S.over!==null)return;if(S.serve!==i){snap();S.serve=i;render()}});
    $(".name",t).addEventListener("input",function(e){S.names[i]=e.target.value;save()});
    $(".clr",t).addEventListener("input",function(e){S.colors[i]=e.target.value;render()});
    $(".rotb",t).addEventListener("click",function(){openRot(i)});
  });
  $("#undo").addEventListener("click",undo);
  $("#whistle").addEventListener("click",function(){sound("whistle")});
  $("#tgl").addEventListener("click",function(){var h=document.body.classList.toggle("hb");this.textContent=h?"Mostrar controles":"Ocultar controles"});
  $("#ovundo").addEventListener("click",undo);
  $("#swap").addEventListener("click",function(){S.flip=!S.flip;render()});
  $("#mute").addEventListener("click",function(){muted=!muted;try{localStorage.setItem(KEY+"-mute",muted?"1":"0")}catch(e){}muteUI();if(!muted)sound("pt")});
  muteUI();
  $("#reset").addEventListener("click",newMatch);
  $("#bestof").addEventListener("change",function(e){
    var v=+e.target.value;
    if(S.hist.length||S.pts[0]||S.pts[1]){if(!confirm("Mudar o formato reinicia a partida. Continuar?")){e.target.value=String(S.best);return}}
    var n=S.names,f=S.flip;S=fresh(v);S.names=n;S.flip=f;stack=[];render();
  });
  $("#ovok").addEventListener("click",function(){
    if(this.dataset.m==="set")commitSet();
    else if(this.dataset.m==="next")nextMatch();
    else{recordMatch();G.i=1;G.h0=H.length;var n=S.names,b=S.best,f=S.flip;S=fresh(b);S.names=n;S.flip=f;stack=[];render()}
  });
  render();
})();
</script>
</body>
</html>
